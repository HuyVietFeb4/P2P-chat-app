plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'

    id 'kotlin-parcelize'
}

android {
    namespace "com.meshenger.backend.session"
    compileSdk 34
    defaultConfig {
        // Change this from 1 to 23
        minSdk 23
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation "com.google.crypto.tink:tink-android:1.12.0"
    implementation project(":backend:security_native")
}
